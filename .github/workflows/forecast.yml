name: Daily forecast

on:
  schedule:
    # GitHub delays scheduled runs by hours and sometimes drops them (the 16 Oct 2026
    # morning run never fired), so each run has backups. Scheduled runs pass
    # --skip-if-done: the first one to land does the work, the rest exit quietly.
    # In Nov 2026 runs started 3-7 h late every day, so the crons are set well ahead
    # of when the forecast is needed. The mode follows the Nepal clock at run time
    # (morning before 12:00), so a run that lands late still does the right thing.
    - cron: "17 20 * * *"   # 20:17 UTC = 02:02 Nepal time: morning run, forecasts TODAY
    - cron: "17 21 * * *"   # 21:17 UTC = 03:02 Nepal time: morning backup
    - cron: "17 22 * * *"   # 22:17 UTC = 04:02 Nepal time: morning backup
    - cron: "32 6 * * *"    # 06:32 UTC = 12:17 Nepal time: evening run, forecasts TOMORROW
    - cron: "32 7 * * *"    # 07:32 UTC = 13:17 Nepal time: evening backup
    - cron: "32 8 * * *"    # 08:32 UTC = 14:17 Nepal time: evening backup
  workflow_dispatch:          # run by hand from the Actions tab (always runs)
    inputs:
      mode:
        description: "auto follows the Nepal clock (morning before 12:00)"
        type: choice
        options: [auto, morning, evening]
        default: auto

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: pip install -r requirements-app.txt
      - name: Forecast
        # Open-Meteo sometimes doesn't answer a runner for minutes (15 Nov 2026: every
        # in-process retry timed out over ~2.5 min). Retry the whole export a few
        # minutes apart before failing, since GitHub may not fire a backup cron for hours.
        run: |
          if [ "${{ inputs.mode }}" = "morning" ] || [ "${{ inputs.mode }}" = "evening" ]; then
            args=(--mode "${{ inputs.mode }}")
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            args=(--skip-if-done)
          else
            args=()
          fi
          for attempt in 1 2 3; do
            python -m src.export_forecast "${args[@]}" && exit 0
            [ "$attempt" -lt 3 ] || break
            echo "::warning title=Forecast::attempt $attempt failed, retrying in 4 minutes"
            sleep 240
          done
          exit 1
      - name: Observations (station SYNOP)
        # Saves only values not recorded yet (last 10 days, so missed runs catch up).
        # An outage must not block the forecast, but it shows as a warning on the run page.
        run: |
          python -m src.fetch_observations || echo "::warning title=Observations::fetch_observations failed, see this step's log"
      - name: Commit the new forecast
        run: |
          # A neutral author that isn't linked to any GitHub account, so automated
          # forecast commits don't show up as a "contributor".
          git config user.name "K Laune forecast"
          git config user.email "forecast@k-laune.invalid"
          git add docs/forecast.json data/verification/forecast_log.csv data/verification/observations.csv
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          parts=()
          git diff --staged --quiet -- docs/forecast.json || parts+=("Forecast")
          git diff --staged --quiet -- data/verification/observations.csv || parts+=("observations")
          [ ${#parts[@]} -gt 0 ] || parts=("Forecast")
          msg="${parts[*]}"
          msg="${msg// / + }"
          git commit -m "${msg^} $(TZ=Asia/Kathmandu date '+%F %H:%M') NPT"
          git pull --rebase origin main
          git push
