name: Daily forecast

on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC = 18:15 Nepal time
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: pip install -r requirements-app.txt
      - run: python -m src.export_forecast
      - name: Commit the new forecast
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/forecast.json data/verification/forecast_log.csv
          git diff --staged --quiet || git commit -m "Forecast for $(date -u +%F)"
          git push
